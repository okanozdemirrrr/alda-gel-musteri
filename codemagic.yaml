workflows:
  ios-app-store:
    name: Alda-Gel iOS Build
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Bağımlılıkları Kur ve Hazırla
        script: |
          npm install
          # Capacitor paketlerini en tepeden kurmaya zorla
          npm install @capacitor/core @capacitor/cli @capacitor/ios
      - name: Next.js Projesini Derle
        script: npm run build
      - name: iOS Platformunu Kur
        script: |
          # npx kullanmadan doğrudan node_modules içindeki cli'yı çağır
          ./node_modules/.bin/cap add ios || true
      - name: Senkronizasyon
        script: |
          ./node_modules/.bin/cap sync ios
      - name: iOS Projesini Derle
        script: |
          WORKSPACE_PATH="ios/App/App.xcodeproj/project.xcworkspace"
          xcodebuild build \
            -workspace "$WORKSPACE_PATH" \
            -scheme "App" \
            -sdk iphoneos \
            -configuration Debug
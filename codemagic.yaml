workflows:
  ios-app-store:
    name: Alda-Gel iOS Build
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
      vars:
        APPLE_TEAM_ID: "2PF3CPKH5Q"
        APP_STORE_CONNECT_ISSUER_ID: "46730e8e-37d5-4cb4-a708-28d4b3da8c1f"
        APP_STORE_CONNECT_KEY_ID: "2PF3CPKH5Q"
        APP_STORE_CONNECT_PRIVATE_KEY: |
          -----BEGIN PRIVATE KEY-----
          MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQg+pgAc3MZH3embQP+
          eT5GtsWNSep3shn7/h96IrS721qgCgYIKoZIzj0DAQehRANCAARAcV+lE3UR6Taw
          7Pb3e4N7ODAaoiS7FERk8t4jWeCg6G+qHq5ilUcQQ848loHPWapS1ipgDhzw+srL
          mQTDu0RQ
          -----END PRIVATE KEY-----
    scripts:
      - name: Bağımlılıkları Kur
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios
      - name: Next.js Projesini Derle
        script: npm run build
      - name: iOS Platformunu Kur ve Senkronize Et
        script: |
          ./node_modules/.bin/cap add ios || true
          ./node_modules/.bin/cap sync ios
      - name: iOS Projesini Derle ve IPA Olarak Paketle
        script: |
          # 1. Apple özel anahtarını diske yaz
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > "$CM_BUILD_DIR/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          
          # 2. Geçici plist dosyasını MANUEL İMZALAMA (manual) ayarıyla oluşturuyoruz
          cat <<EOF > "$CM_BUILD_DIR/exportOptions.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

          # 3. Xcode proje dosyasındaki otomatik imzalamayı (Automatic Signing) tamamen KAPATIYORUZ.
          # Takım kimliğini yazıp, imzalama stilini 'Manual' yapıyoruz ki hesap sorma hatası vermesin.
          XCODE_PROJ_PATH="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' "s/DevelopmentTeam = .*/DevelopmentTeam = $APPLE_TEAM_ID;/g" "$XCODE_PROJ_PATH" || true
          sed -i '' "s/DEVELOPMENT_TEAM = .*/DEVELOPMENT_TEAM = $APPLE_TEAM_ID;/g" "$XCODE_PROJ_PATH" || true
          sed -i '' "s/ProvisioningStyle = Automatic;/ProvisioningStyle = Manual;/g" "$XCODE_PROJ_PATH" || true
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$XCODE_PROJ_PATH" || true

          WORKSPACE_PATH="ios/App/App.xcodeproj/project.xcworkspace"
          
          # 4. Projeyi arşivliyoruz (Hesap aramayı zorla engelledik, bulut api anahtarıyla güncelleyecek)
          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "App" \
            -archivePath build/ios/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -authenticationKeyPath "$CM_BUILD_DIR/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE="Manual"

          # 5. Arşivden nihai .ipa dosyasını dışarı aktarıyoruz
          xcodebuild -exportArchive \
            -archivePath build/ios/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist "$CM_BUILD_DIR/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -authenticationKeyPath "$CM_BUILD_DIR/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
    artifacts:
      - build/ios/ipa/*.ipa
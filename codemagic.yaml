workflows:
  ios-app-store:
    name: Alda-Gel iOS Build
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Paketleri Yükle
        script: npm install
      - name: Next.js Projesini Derle
        script: npm run build
      - name: iOS Platformunu Kur ve Senkronize Et
        script: |
          # Önce platformu ekle, hata verirse zaten var demektir, devam et
          npx cap add ios || true
          # Bekle, dosya sisteminin kendine gelmesini sağla
          sleep 5
          # Şimdi sync et
          npx cap sync ios
      - name: iOS Projesini Derle
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "App" \
            --disable-codesign
workflows:
  ios-app-store:
    name: Alda-Gel iOS Build
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Bağımlılıkları Kur
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios
      - name: Next.js Projesini Derle
        script: npm run build
      - name: iOS Platformunu Kur ve Senkronize Et
        script: |
          ./node_modules/.bin/cap add ios || true
          ./node_modules/.bin/cap sync ios
      - name: iOS Projesini Derle
        script: |
          # DEVELOPMENT_TEAM parametresiyle Apple Developer Team ID'ni buraya zorla gömüyoruz.
          # ÖNEMLİ: Alttaki XXXXXXXXXX yerine KENDİ APPLE TEAM ID'ni yazacaksın kanka.
          xcodebuild build \
            -workspace ios/App/App.xcodeproj/project.xcworkspace \
            -scheme "App" \
            -configuration Debug \
            DEVELOPMENT_TEAM="XXXXXXXXXX" \
            CODE_SIGN_ALLOW_FAILED_TESTS=YES \
            CODE_SIGNING_ALLOWED=NO
workflows:
  ios-app-store:
    name: Alda-Gel iOS Build
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Paketleri ve iOS Gereksinimlerini Yükle
        script: |
          npm install
          npm install @capacitor/ios --save-dev
      - name: Next.js Projesini Derle
        script: npm run build
      - name: iOS Platformunu Kur ve Senkronize Et
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: iOS Projesini Derle
        script: |
          # Önce dosya yapısını kontrol edelim (debug)
          ls -R ios
          
          # xcworkspace dosyasını otomatik bulup build al
          WORKSPACE_PATH=$(find ios -name "*.xcworkspace" | head -n 1)
          echo "Workspace bulundu: $WORKSPACE_PATH"
          
          xcode-project build-ipa \
            --workspace "$WORKSPACE_PATH" \
            --scheme "App" \
            --disable-codesign
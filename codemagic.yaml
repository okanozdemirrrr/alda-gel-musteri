workflows:
  ios-app-store:
    name: Alda-Gel iOS Build
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Bağımlılıkları Kur
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios
      - name: Next.js Projesini Derle
        script: npm run build
      - name: iOS Platformunu Kur ve Senkronize Et
        script: |
          ./node_modules/.bin/cap add ios || true
          ./node_modules/.bin/cap sync ios
      - name: iOS Projesini Derle ve Otomatik İmzala
        script: |
          # Workspace yolunu sabitliyoruz
          WORKSPACE_PATH="ios/App/App.xcodeproj/project.xcworkspace"
          
          # Apple Developer portalından otomatik profil çekerek imzala
          xcode-project build-ipa \
            --workspace "$WORKSPACE_PATH" \
            --scheme "App" \
            --archive-xcargs "-allowProvisioningUpdates"
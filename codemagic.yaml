workflows:
  ios-app-store:
    name: Alda-Gel iOS Build
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_CONNECT_ISSUER_ID: "46730e8e-37d5-4cb4-a708-28d4b3da8c1f"
        APP_STORE_CONNECT_KEY_ID: "2PF3CPKH5Q"
        APP_STORE_CONNECT_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQg+pgAc3MZH3embQP+\neT5GtsWNSep3shn7/h96IrS721qgCgYIKoZIzj0DAQehRANCAARAcV+lE3UR6Taw\n7Pb3e4N7ODAaoiS7FERk8t4jWeCg6G+qHq5ilUcQQ848loHPWapS1ipgDhzw+srL\nmQTDu0RQ\n-----END PRIVATE KEY-----"
    scripts:
      - name: Bağımlılıkları Kur
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios
      - name: Next.js Projesini Derle
        script: npm run build
      - name: iOS Platformunu Kur ve Senkronize Et
        script: |
          ./node_modules/.bin/cap add ios || true
          ./node_modules/.bin/cap sync ios
      - name: Apple Anahtarını ve Plist Dosyasını Hazırla
        script: |
          # 1. Apple'ın bizden istediği private key dosyasını doğru dizine oluşturuyoruz
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" > "AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
          
          # 2. Sürekli hata veren export_options.plist dosyasını manuel yaratıp diske yazıyoruz
          cat <<EOF > exportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF
      - name: iOS Projesini Derle ve IPA Olarak Paketle
        script: |
          WORKSPACE_PATH="ios/App/App.xcodeproj/project.xcworkspace"
          
          # 3. Önce projeyi Apple sunucularından imza çekerek arşivliyoruz
          xcodebuild archive \
            -workspace "$WORKSPACE_PATH" \
            -scheme "App" \
            -archivePath build/ios/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -authenticationKeyPath "AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"

          # 4. Arşivden nihai .ipa dosyasını dışarı aktarıyoruz
          xcodebuild -exportArchive \
            -archivePath build/ios/App.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -authenticationKeyPath "AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"
    artifacts:
      - build/ios/ipa/*.ipa
workflows:
  ios-app-store:
    name: Alda-Gel iOS Build
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Gerekli Paketleri Kur
        script: |
          npm install
          npm install -g @capacitor/cli @capacitor/core @capacitor/ios
      - name: Next.js Projesini Derle
        script: npm run build
      - name: iOS Platformunu Kur ve Senkronize Et
        script: |
          # Önce klasörü temizle ki çakışma olmasın
          rm -rf ios
          npx cap add ios
          npx cap sync ios
      - name: iOS Projesini Derle
        script: |
          WORKSPACE_PATH="ios/App/App.xcodeproj/project.xcworkspace"
          xcodebuild build \
            -workspace "$WORKSPACE_PATH" \
            -scheme "App" \
            -sdk iphoneos \
            -configuration Debug
workflows:
  ios-app-store:
    name: Alda-Gel iOS Build
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Node ve NPM Sürümü
        script: |
          node -v
          npm -v
      - name: Paketleri Yükle
        script: npm install
      - name: Next.js Projesini Derle
        script: npm run build
      - name: Capacitor iOS Platformunu Ekle
        script: |
          npx cap add ios || echo "iOS platformu zaten var"
      - name: Capacitor iOS Senkronizasyonu
        script: npx cap sync ios
      - name: iOS Projesini Derle
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "App" \
            --disable-codesign
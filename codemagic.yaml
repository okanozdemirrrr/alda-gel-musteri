workflows:
  ios-app-store:
    name: Alda-Gel iOS Build
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Bağımlılıkları Kur
        script: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios
      - name: Next.js Projesini Derle
        script: npm run build
      - name: iOS Platformunu Kur ve Senkronize Et
        script: |
          ./node_modules/.bin/cap add ios || true
          ./node_modules/.bin/cap sync ios
      - name: iOS Projesini Derle
        script: |
          # En temel derleme komutu. Hiçbir parametre yok, hata payı sıfır.
          xcodebuild build -workspace ios/App/App.xcodeproj/project.xcworkspace -scheme "App" -configuration Debug
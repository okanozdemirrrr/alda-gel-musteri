workflows:
  ios-app-store:
    name: Alda-Gel iOS Build
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Paketleri ve iOS Gereksinimlerini Yükle
        script: |
          npm install
          npm install @capacitor/ios --save-dev
      - name: Next.js Projesini Derle
        script: npm run build
      - name: iOS Platformunu Kur ve Senkronize Et
        script: |
          # Önce platformu ekle, hata verirse görmezden gel
          npx cap add ios || true
          # Şimdi sync et
          npx cap sync ios
      - name: iOS Projesini Derle
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "App" \
            --disable-codesign